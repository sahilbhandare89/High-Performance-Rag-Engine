spring:
  application:
    name: rag-engine

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

rag:
  chunking:
    fixed-size:
      chunk-size: 500
      overlap: 50

  embedding:
    provider: local
    model: fake-v1
    dimensions: 8
    batch-size: 3
    timeout: 5s

    retry:
      max-attempts: 3
      initial-backoff: 200ms
      max-backoff: 2s

    rate-limit:
      interval: 100ms

